name: Unified CI/CD Pipeline

on:
  push:
    branches: [main, development,  9.2C] # added other branches
  pull_request:
    branches: [main, development,  9.2C] # added pull request trigger
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}

jobs:
  build-and-test:
    name: Build and Test Services
    runs-on: ubuntu-latest
    
    env:
    DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orders

    services: # postgres stuff for order_service
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: orders
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      matrix:
        include:
          - service: frontend
            path: ./frontend
          - service: product_service
            path: ./backend/product_service
          - service: order_service
            path: ./backend/order_service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: ${{ matrix.service == 'frontend' }}
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Set up Python
        if: ${{ matrix.service != 'frontend' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.service }}-${{ hashFiles('**/package-lock.json', '**/requirements.txt') }}

      - name: Install dependencies
        run: |
          if [ "${{ matrix.service }}" == "frontend" ]; then
            cd frontend && npm install
          else
            pip install --upgrade pip
            pip install -r backend/${{ matrix.service }}/requirements.txt
            pip install pytest flake8
          fi

      - name: Run lint and tests # linting and testing for quality assurance
        run: |
          if [ "${{ matrix.service }}" == "frontend" ]; then
            echo "Skipping frontend tests"
          else
            flake8 backend/${{ matrix.service }} --max-line-length=500 --ignore=F401,F841,W503
            pytest backend/${{ matrix.service }}/tests --maxfail=1 --disable-warnings -q
          fi

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        include:
          - service: frontend
            path: ./frontend
          - service: product_service
            path: ./backend/product_service
          - service: order_service
            path: ./backend/order_service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.AZURE_ACR_NAME }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:latest ${{ matrix.path }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:latest

      - name: Logout from Azure
        run: az logout
        if: always()

  deploy-to-aks:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: Production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        run: |
          az aks get-credentials --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} --name ${{ secrets.AKS_CLUSTER_NAME }} --overwrite-existing
          az aks update --name ${{ secrets.AKS_CLUSTER_NAME }} --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} --attach-acr ${{ secrets.AZURE_ACR_NAME }}

      - name: Deploy Backend
        run: |
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/product-db.yaml
          kubectl apply -f k8s/order-db.yaml
          kubectl apply -f k8s/product-service.yaml
          kubectl apply -f k8s/order-service.yaml

      - name: Deploy Frontend
        run: |
          kubectl apply -f k8s/frontend.yaml

      - name: Logout from Azure
        run: az logout
